

services:
  db:
    image: postgres:14.3
    restart: always
    ports:
      - "6432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: claud_db_erp
    container_name: postgres_claudposerp
    volumes:
      - ./postgres:/var/lib/postgresql/data
 